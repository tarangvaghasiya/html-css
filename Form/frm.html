<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <form action="" method="post">
            <label for="fname">First name:</label>
            <input type="text" id="fname" placeholder="enter your first name">
            <br>
            <label for="lname">last name:</label>
            <input type="text" id="lname" placeholder="enter your last name">
            <br>
            <label for="email">email:</label>
            <input type="email" id="email" placeholder="enter Email addewss">
            <br>
            <label for="pass">password:</label>
            <input type="password" id="pass">
            <br>
            <label>gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br>
            <input type="submit" value="Save">
            <br>
            <input type="submit" value="save and open new tab" formtarget="_blank">
        </form>
      <audio src="Rename.mp3.mpeg" controls loop></audio>
      <video src="sample_video (720p).mp4" controls width="400" height="300" autoplay loop poster="../images.png" disablePictureinPicture></video>
      <video controls>
        <source src="sample_video (720p).mp4" type="video/mp4">
        <track src="tara.vtt" label="english">
      </video>
            
    </body>
</html>
