<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
       <br>
            <label for="fname">First name:</label>
            <input type="text" id="fname" placeholder="enter your first name">
        <br>
          <label for="lname">last name:</label>
            <input type="text" id="lname" placeholder="enter your last name">
        <br>
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="enter Email addewss">
        <br>
        <label for="pass">password:</label>
        <input type="password" id="pass">
        <br>
        <lable>gender:</lable>
        <input type="radio" name="gender">
        <label>male</label>
        <input type="radio" name="gender">
        <label>female</label>
        <input type="radio" name="gender">
        <label>other</label>
        <br>
        <label>age</label>
          <select>
                <option value="select">select</option>
                <option value="select">17</option>
                <option value="select">18</option>
                <option value="select">19</option>
            </select>
        <br>
        <label>preferences:</label>
        <input type="checkbox" name="pre">
        <lable>Acrylic painting</lable>    
         <input type="checkbox" name="pre">
        <lable>oil painting</lable> 
         <input type="checkbox" name="pre">
        <lable>water colour painting</lable>
        <br>
        <label>select occupation</label>
          <select style="color: aqua; background-color: blue;">
                <option value="student">student</option>
                <option value="worker">worker</option>

            </select>
            <br>
            <lable>Bio</lable>
            <textarea rows="3" cols="30" placeholder="share few lines about yourself..."></textarea>
            <br>
            <button type="reset">reset</button>
            <button type="submit">submit</button>
     
        
    </form>

    <form autocomplete="on" action="/submit" id="111">
        <input type="hidden"  name="userid" value="123">
        <input type="text" id="" value="123">
        <input type="submit" value="submit">

        <input type="image" src="images.png">
        <input type="month" name="" id="" min="january, 2026">
        <input type="number" name="" id="" min="20" max="60">
        <br>
        <lable>search</lable> 
        <input type="search">
        <br>
        <label for="tel">phone no.</label>
        <input type="tel" name="" id="tel">
        <br>
        <label for="url">url</label>
        <input type="url" name="" id="url">
        <br>
        <label for="time">time</label>
        <input type="time" name="" id="time" autofocus>
        <br>
        <label for="week">week</label>
        <input type="week" name="" id="week">
        <br>
        <lable for="mon">month</lable>
        <input type="month" name="" id="mon">
        <br>
        <label>select file</label>
        <input type="file" name="" id="" multiple>
        <br>
        <input type="date" min="10-8-2026" max="20-8-2026" required>
        <br>
        <input type="text" pattern="[e-j]{5}" autofocus>
        <br>
        <input type="number" name="" id="" step="2.8">
        <br>
        <input list="name" autocomplete="on">
        <datalist id="name">
            <option value="tarang">
                 <option value="jeet">
                     <option value="gunjan">
        </datalist>
        <input type="file" accept=".pdf",.jpg>
        <br>
       

    </form>
     <input type="text" form="111">
     
</body>
</html>
