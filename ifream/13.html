<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aspect Ratio Responsive Iframe</title>
  <style>
    .aspect-container {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .aspect-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="aspect-container">
    <iframe src="https://www.example.com" title="16:9 Aspect Ratio Maintained View"></iframe>
  </div>

</body>
</html>
