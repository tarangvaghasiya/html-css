<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Link Manager</title>
  <style>
    ul { list-style-type: none; padding: 0; }
    li { display: inline-block; margin-right: 15px; }
  </style>
</head>
<body>

  <ul>
    <li><a href="https://www.example.com" target="fullscreenFrame">Site A</a></li>
    <li><a href="https://www.example.org" target="fullscreenFrame">Site B</a></li>
    <li><a href="https://www.wikipedia.org" target="fullscreenFrame">Site C</a></li>
  </ul>

  <iframe name="fullscreenFrame" src="https://www.example.com" width="100%" height="450" allow="fullscreen" allowfullscreen title="Targeted Fullscreen Content Viewer"></iframe>

</body>
</html>
