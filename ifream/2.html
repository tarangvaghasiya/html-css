<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Targeted Iframe Navigation</title>
</head>
<body>

  <p>
    <a href="https://www.example.com" target="mainFrame">Open Example Site</a>
  </p>

  <iframe name="mainFrame" src="about:blank" width="100%" height="300" title="Dynamic Site Display Area"></iframe>

</body>
</html>
