<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Control Panel</title>
  <style>
    .device-frame {
      width: 45%;
      height: 400px;
      display: inline-block;
      vertical-align: top;
      margin-right: 4%;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <iframe class="device-frame" src="https://usb.example.com" allow="usb" title="USB Hardware Device Controller"></iframe>
  <iframe class="device-frame" src="https://gyro.example.com" allow="gyroscope" title="Gyroscope Orientation Sensor Panel"></iframe>

</body>
</html>
