<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Video Player</title>
  <style>
    .video-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }
    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 600px) {
      .video-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="fullscreen; gyroscope" allowfullscreen title="Responsive 16:9 Gyroscope Video Player"></iframe>
  </div>

</body>
</html>
