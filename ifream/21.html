<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Action Controller</title>
  <style>
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-family: sans-serif;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <a href="https://device.example.com" target="myDeviceFrame" class="btn">Connect Device</a>

  <iframe name="myDeviceFrame" src="about:blank" width="100%" height="400" allow="usb" title="USB Device Console Viewer"></iframe>

</body>
</html>
