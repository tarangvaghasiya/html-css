<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side by Side Iframes</title>
  <style>
    .side-iframe {
      width: 48%;
      height: 350px;
      display: inline-block;
      vertical-align: top;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <iframe class="side-iframe" src="https://video.example.com" allow="fullscreen" allowfullscreen title="Fullscreen Cinema Player"></iframe>
  <iframe class="side-iframe" src="https://motion.example.com" allow="gyroscope" title="Motion Sensor Viewer"></iframe>

</body>
</html>
