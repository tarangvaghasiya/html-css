<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Permission Showcase</title>
  <style>
    iframe { display: block; margin-bottom: 20px; border: 1px solid #aaa; }
  </style>
</head>
<body>

  <!-- First: Only Fullscreen -->
  <iframe src="https://video.example.com" width="400" height="250" allow="fullscreen" allowfullscreen title="Compact Video Player Window"></iframe>

  <!-- Second: Only Gyroscope -->
  <iframe src="https://gyro.example.com" width="600" height="350" allow="gyroscope" title="Medium Motion Orientation Console"></iframe>

  <!-- Third: Only USB -->
  <iframe src="https://device.example.com" width="800" height="450" allow="usb" title="Large USB Hardware Diagnostic Panel"></iframe>

</body>
</html>
